<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>忘记密码 - TempWeb</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-light bg-white shadow-sm">
  <div class="container" style="max-width:1200px">
    <a class="navbar-brand fw-bold" href="/index.html"><span class="brand-icon">T</span> TempWeb</a>
  </div>
</nav>

<div class="container d-flex justify-content-center" style="margin-top:80px;">
  <div style="width:420px;">
    <div class="card border-0 shadow-sm p-4 text-center">
      <i class="bi bi-key display-4 text-muted mb-3 d-block"></i>
      <h4 class="fw-bold">忘记密码</h4>
      <p class="text-muted mb-4">输入您的注册邮箱，我们将发送重置链接</p>

      <div class="mb-3 text-start">
        <label class="form-label fw-semibold">邮箱地址</label>
        <input type="email" class="form-control" id="reset-email" placeholder="your@email.com">
      </div>

      <button class="btn btn-primary w-100 py-2" id="btn-send" onclick="doSend()">发送重置邮件</button>

      <div class="text-center mt-3"><a href="/login.html" class="text-decoration-none small">返回登录</a></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script>
async function doSend() {
  const btn = document.getElementById('btn-send');
  btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>发送中...';
  try {
    const res = await apiPost('/api/auth.php?action=forgot_password', { email: document.getElementById('reset-email').value.trim() });
    if (res.code === 0) { showAlert('发送成功', res.message || '重置链接已发送', () => { window.location.href = '/login.html'; }); }
    else showAlert('发送失败', res.message || '发送失败');
  } catch (e) { showAlert('网络错误', '网络连接失败，请稍后重试'); } finally { btn.disabled = false; btn.innerHTML = '发送重置邮件'; }
}
</script>
</body>
</html>
