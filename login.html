<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>登录 - TempWeb</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-light bg-white shadow-sm">
  <div class="container" style="max-width:1200px">
    <a class="navbar-brand fw-bold" href="/index.html"><span class="brand-icon">T</span> <span id="site-name">TempWeb</span></a>
  </div>
</nav>

<div class="container" style="max-width:1000px;margin-top:60px;">
  <div class="row g-0 bg-white rounded-4 shadow-sm overflow-hidden">
    <!-- 左侧品牌区 -->
    <div class="col-md-5 d-none d-md-flex flex-column justify-content-center p-5 text-white" style="background:linear-gradient(135deg,#18a058,#36d399,#2080f0);">
      <h2 class="fw-bold mb-3" id="brand-title">TempWeb</h2>
      <p class="mb-4 opacity-75" id="brand-desc">开源免费临时HTML/ZIP托管平台</p>
      <div class="d-flex flex-column gap-3">
        <div><i class="bi bi-check-circle-fill me-2"></i>免登录即用，秒级部署</div>
        <div><i class="bi bi-check-circle-fill me-2"></i>私有化部署，数据自主</div>
        <div><i class="bi bi-check-circle-fill me-2"></i>所有配置后台可改</div>
      
      </div>
    </div>
    <!-- 右侧表单 -->
    <div class="col-md-7 p-5">
      <h3 class="fw-bold mb-1">欢迎回来</h3>
      <p class="text-muted mb-4">登录到 <span id="site-name">TempWeb</span></p>

      <div class="mb-3">
        <label class="form-label fw-semibold">账号</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="login-account" placeholder="用户名或邮箱">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">密码</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="login-password" placeholder="密码">
        </div>
      </div>

      <div id="captcha-row" class="mb-3" style="display:none">
        <label class="form-label fw-semibold">验证码</label>
        <div class="d-flex gap-2">
          <input type="text" class="form-control" id="captcha-code" placeholder="验证码" style="max-width:120px;">
          <img id="captcha-img" src="" style="height:38px;cursor:pointer;border-radius:6px;" onclick="loadCaptcha()">
          <input type="hidden" id="captcha-token">
        </div>
      </div>

      <button class="btn btn-primary w-100 py-2 fw-semibold mt-2" id="btn-login" onclick="doLogin()">登录</button>

      <div class="text-center mt-3">
        <span class="text-muted">还没有账号？</span>
        <a href="/register.html" class="text-decoration-none fw-semibold" style="color:var(--primary)">立即注册</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script>
loadSiteInfo().then(info => {
  const name = info.site_name || 'TempWeb';
  document.getElementById('site-name').textContent = name;
  document.getElementById('brand-title').textContent = name;
  document.getElementById('brand-desc').textContent = info.site_desc || '开源免费临时HTML/ZIP托管平台';
  document.title = '登录 - ' + name;
  if (info.captcha_login === '1') { document.getElementById('captcha-row').style.display = ''; loadCaptcha(); }
});

async function loadCaptcha() {
  const res = await apiGet('/api/auth.php?action=captcha');
  if (res.code === 0) { document.getElementById('captcha-img').src = res.data.image; document.getElementById('captcha-token').value = res.data.token; }
}

document.getElementById('login-password').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

async function doLogin() {
  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>登录中...';

  try {
    const data = { account: document.getElementById('login-account').value.trim(), password: document.getElementById('login-password').value };
    if (document.getElementById('captcha-row').style.display !== 'none') {
      data.captcha_token = document.getElementById('captcha-token').value;
      data.captcha_code = document.getElementById('captcha-code').value;
    }
    const res = await apiPost('/api/auth.php?action=login', data);
    if (res.code === 0) {
      saveLogin(res.data.token, res.data.user);
      window.location.href = '/projects.html';
    } else {
      showAlert('登录失败', res.message || '登录失败');
      if (document.getElementById('captcha-row').style.display !== 'none') loadCaptcha();
    }
  } catch (e) { showAlert('网络错误', '网络连接失败，请稍后重试'); } finally {
    btn.disabled = false; btn.innerHTML = '登录';
  }
}
</script>
</body>
</html>
