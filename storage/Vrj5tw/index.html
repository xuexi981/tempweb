<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>引力粒子风暴沙盒</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            cursor: crosshair;
            font-family: sans-serif;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* 右上角操作提示框 */
        .ui-tip {
            position: absolute;
            top: 20px;
            right: 20px;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            pointer-events: none;
            font-size: 13px;
            line-height: 1.6;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
    </style>
</head>
<body>

    <canvas id="sandbox"></canvas>
    
    <div class="ui-tip">
        移入鼠标：**吸引粒子**<br>
        按住左键：**强力排斥**<br>
        炫酷特效：双击进入疯狂模式
    </div>

    <script>
        const canvas = document.getElementById('sandbox');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);

        // 鼠标交互状态
        const mouse = {
            x: null,
            y: null,
            active: false,
            repelling: false
        };

        // 粒子配置
        const PARTICLE_COUNT = 1500; // 粒子数量
        const particles = [];
        const colors = ['#00fffc', '#fc00ff', '#fffc00', '#00ff18', '#ff003c'];

        // 粒子类定义
        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = Math.random() * 2 + 1;
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = Math.random() * 0.5 + 0.5;
            }

            update() {
                // 基础漂移惯性
                this.x += this.vx;
                this.y += this.vy;

                // 阻尼摩擦力（防止粒子无限加速）
                this.vx *= 0.98;
                this.vy *= 0.98;

                // 鼠标引力/排斥力计算
                if (mouse.active && mouse.x !== null) {
                    const dx = mouse.x - this.x;
                    const dy = mouse.y - this.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (distance < 400) { // 交互影响半径
                        const force = (400 - distance) / 400; // 距离越近力越大
                        
                        if (mouse.repelling) {
                            // 强力排斥模式
                            this.vx -= (dx / distance) * force * 1.5;
                            this.vy -= (dy / distance) * force * 1.5;
                        } else {
                            // 引力吸附模式
                            this.vx += (dx / distance) * force * 0.6;
                            this.vy += (dy / distance) * force * 0.6;
                        }
                    }
                }

                // 边界碰撞回弹
                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                // 让粒子自带一点霓虹发光
                ctx.shadowBlur = 6;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        // 初始化粒子群
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            particles.push(new Particle());
        }

        // 监听鼠标/触摸事件
        window.addEventListener('mousemove', (e) => {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
            mouse.active = true;
        });

        window.addEventListener('mouseleave', () => {
            mouse.active = false;
        });

        window.addEventListener('mousedown', () => {
            mouse.repelling = true;
        });

        window.addEventListener('mouseup', () => {
            mouse.repelling = false;
        });

        // 兼容移动端触摸
        window.addEventListener('touchmove', (e) => {
            mouse.x = e.touches[0].clientX;
            mouse.y = e.touches[0].clientY;
            mouse.active = true;
        });

        window.addEventListener('touchend', () => {
            mouse.active = false;
        });

        // 极速渲染循环
        function loop() {
            // 通过极高透明度的黑色刷屏，营造粒子流动的精美“丝滑拖尾”
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
