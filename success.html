<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>上传成功 - TempWeb</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-light bg-white shadow-sm">
  <div class="container" style="max-width:1200px">
    <a class="navbar-brand fw-bold" href="/index.html"><span class="brand-icon">T</span> TempWeb</a>
  </div>
</nav>

<div class="container d-flex justify-content-center" style="margin-top:60px;">
  <div style="width:560px;">
    <div class="card border-0 shadow-sm p-5 text-center">
      <div class="success-icon mb-3">
        <i class="bi bi-check-circle-fill text-success" style="font-size:64px;"></i>
      </div>
      <h3 class="fw-bold mb-2">发布成功！</h3>
      <p class="text-muted mb-4">你的作品已经上线，可以通过以下链接访问</p>

      <div class="bg-light rounded-3 p-3 mb-3">
        <div class="input-group">
          <input type="text" class="form-control font-monospace" id="project-url" readonly>
          <button class="btn btn-primary" onclick="copyText(document.getElementById('project-url').value)">
            <i class="bi bi-clipboard me-1"></i>复制
          </button>
        </div>
      </div>

      <div class="bg-light rounded-3 p-3 mb-4">
        <label class="form-label small text-muted mb-1">嵌入代码</label>
        <div class="input-group">
          <input type="text" class="form-control font-monospace small" id="embed-code" readonly>
          <button class="btn btn-outline-secondary btn-sm" onclick="copyText(document.getElementById('embed-code').value)">
            <i class="bi bi-clipboard"></i>
          </button>
        </div>
      </div>

      <div class="d-grid gap-2">
        <a href="#" id="btn-visit" class="btn btn-primary btn-lg" target="_blank">
          <i class="bi bi-box-arrow-up-right me-1"></i>访问页面
        </a>
      </div>
      <div class="d-flex gap-2 mt-3">
        <a href="/index.html" class="btn btn-outline-secondary flex-fill">继续上传</a>
        <a href="/projects.html" class="btn btn-outline-primary flex-fill">我的作品</a>
      </div>

      <div class="mt-4 text-muted small" id="guest-hint" style="display:none">
        注册账号可管理此作品 <a href="/register.html">立即注册</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script>
const code = new URLSearchParams(window.location.search).get('code');
if (!code) window.location.href = '/';

loadSiteInfo().then(info => {
  const siteUrl = (info.site_url || window.location.origin).replace(/\/+$/, '');
  const projectUrl = siteUrl + '/s/' + code;
  document.getElementById('project-url').value = projectUrl;
  document.getElementById('embed-code').value = '<iframe src="' + projectUrl + '" width="100%" height="600" frameborder="0"></iframe>';
  document.getElementById('btn-visit').href = projectUrl;
  if (!getToken()) document.getElementById('guest-hint').style.display = '';
});
</script>
</body>
</html>
