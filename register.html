<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>注册 - TempWeb</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="/assets/css/style.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-light bg-white shadow-sm">
  <div class="container" style="max-width:1200px">
    <a class="navbar-brand fw-bold" href="/index.html"><span class="brand-icon">T</span> <span id="site-name">TempWeb</span></a>
  </div>
</nav>

<div class="container" style="max-width:1000px;margin-top:40px;">
  <div class="row g-0 bg-white rounded-4 shadow-sm overflow-hidden">
    <div class="col-md-5 d-none d-md-flex flex-column justify-content-center p-5 text-white" style="background:linear-gradient(135deg,#2080f0,#6366f1,#a855f7);">
      <h2 class="fw-bold mb-3" id="brand-title">加入 TempWeb</h2>
      <p class="mb-4 opacity-75" id="brand-desc">创建账号，解锁更多功能</p>
      <div class="d-flex flex-column gap-3">
        <div><i class="bi bi-check-circle-fill me-2"></i>管理你的作品</div>
        <div><i class="bi bi-check-circle-fill me-2"></i>自定义过期时间</div>
        <div><i class="bi bi-check-circle-fill me-2"></i>访问统计与嵌入</div>
    
      </div>
    </div>
    <div class="col-md-7 p-5">
      <h3 class="fw-bold mb-1">创建账号</h3>
      <p class="text-muted mb-4">注册到 <span id="site-name">TempWeb</span></p>

      <div class="mb-3">
        <label class="form-label fw-semibold">用户名</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control" id="reg-username" placeholder="3-50个字符">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">邮箱</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control" id="reg-email" placeholder="邮箱地址">
        </div>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">密码</label>
        <div class="input-group">
          <span class="input-group-text bg-light"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control" id="reg-password" placeholder="至少6个字符">
        </div>
      </div>

      <div id="captcha-row" class="mb-3" style="display:none">
        <label class="form-label fw-semibold">验证码</label>
        <div class="d-flex gap-2">
          <input type="text" class="form-control" id="captcha-code" placeholder="验证码" style="max-width:120px;">
          <img id="captcha-img" src="" style="height:38px;cursor:pointer;border-radius:6px;" onclick="loadCaptcha()">
          <input type="hidden" id="captcha-token">
        </div>
      </div>

      <div id="invite-row" class="mb-3" style="display:none">
        <label class="form-label fw-semibold">邀请码</label>
        <input type="text" class="form-control" id="reg-invite" placeholder="输入邀请码">
      </div>

      <button class="btn btn-primary w-100 py-2 fw-semibold mt-2" id="btn-register" onclick="doRegister()">注册</button>

      <div class="text-center mt-3">
        <span class="text-muted">已有账号？</span>
        <a href="/login.html" class="text-decoration-none fw-semibold" style="color:var(--primary)">立即登录</a>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/assets/js/api.js"></script>
<script>
loadSiteInfo().then(info => {
  const name = info.site_name || 'TempWeb';
  document.getElementById('site-name').textContent = name;
  document.getElementById('brand-title').textContent = '加入 ' + name;
  document.getElementById('brand-desc').textContent = info.site_desc || '创建账号，解锁更多功能';
  document.title = '注册 - ' + name;
  if (info.captcha_register === '1') { document.getElementById('captcha-row').style.display = ''; loadCaptcha(); }
  if (info.require_invite === '1') document.getElementById('invite-row').style.display = '';
});

async function loadCaptcha() {
  const res = await apiGet('/api/auth.php?action=captcha');
  if (res.code === 0) { document.getElementById('captcha-img').src = res.data.image; document.getElementById('captcha-token').value = res.data.token; }
}

async function doRegister() {
  const btn = document.getElementById('btn-register');
  btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>注册中...';
  try {
    const data = {
      username: document.getElementById('reg-username').value.trim(),
      email: document.getElementById('reg-email').value.trim(),
      password: document.getElementById('reg-password').value,
      invite_code: document.getElementById('reg-invite').value.trim(),
    };
    if (document.getElementById('captcha-row').style.display !== 'none') {
      data.captcha_token = document.getElementById('captcha-token').value;
      data.captcha_code = document.getElementById('captcha-code').value;
    }
    const res = await apiPost('/api/auth.php?action=register', data);
    if (res.code === 0) {
      saveLogin(res.data.token, res.data.user);
      window.location.href = '/projects.html';
    } else { showAlert('注册失败', res.message || '注册失败'); if (document.getElementById('captcha-row').style.display !== 'none') loadCaptcha(); }
  } catch (e) { showAlert('网络错误', '网络连接失败，请稍后重试'); } finally { btn.disabled = false; btn.innerHTML = '注册'; }
}
</script>
</body>
</html>
